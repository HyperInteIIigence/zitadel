name: HyperSMS Console validation

on:
  push:
    branches:
      - feature/hypersms-http-provider-console-20261120
  workflow_dispatch:

permissions:
  contents: read

jobs:
  console:
    name: Compile HyperSMS Console changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Console without Nx cache
        run: pnpm exec nx run @zitadel/console:build --skip-nx-cache
